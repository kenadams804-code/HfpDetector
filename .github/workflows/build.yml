name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 【核心新增】：如果发现没有钥匙文件，让云端打包机在线去官方服务器下载最新的 jar 钥匙
    - name: Automatically Download Gradle Wrapper Jar
      run: |
        mkdir -p gradle/wrapper
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo "本地缺少钥匙文件，正在从官方下载..."
          curl -Lo gradle/wrapper/gradle-wrapper.jar https://githubusercontent.com
        fi

    - name: Grant execute permission for gradlew
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
        fi

    - name: Build with Gradle
      run: |
        if [ -f gradlew ]; then
          ./gradlew assembleDebug
        else
          echo "未找到编译脚本！"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hfp-detector-apk
        path: app/build/outputs/apk/debug/app-debug.apk
