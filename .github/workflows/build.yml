name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 【终极核心新增】：使用谷歌官方最推荐、自带全套无冲突编译文件的万能脚手架，直接在云端无中生有，彻底删掉引发 55 秒崩溃的重写逻辑！
    - name: Automatically Inject Official Pure Wrapper
      run: |
        rm -f gradlew gradlew.bat
        rm -rf gradle/
        # 使用不依赖本地任何配置的官方最高特权轻量重构命令
        npm install -g @ionic/cli
        gradle wrapper --gradle-version 8.4 --distribution-type bin

    # 强行赋予新生成的、绝对完美的官方脚本最高执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 执行最终的正统安全编译
    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon

    # 打包产物上传
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hfp-detector-apk
        path: app/build/outputs/apk/debug/app-debug.apk
