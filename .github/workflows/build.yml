name: Build Android APK (Cloud Only)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_VERSION: "8.7"
      ANDROID_PLATFORM: "34"
      ANDROID_BUILD_TOOLS: "34.0.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 安装 Android SDK（关键：否则经常会报 “SDK location not found”）
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          yes | sdkmanager --licenses

      # 给 Android Gradle Plugin 一个明确的 SDK 路径
      - name: Write local.properties (sdk.dir)
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties

      - name: Download Gradle (fixed version, no wrapper)
        run: |
          set -e
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          unzip -q gradle.zip
          mv gradle-${GRADLE_VERSION} /tmp/gradle
          /tmp/gradle/bin/gradle --version

      - name: Build Debug APK
        run: |
          /tmp/gradle/bin/gradle clean assembleDebug --stacktrace --no-daemon --info --console=plain

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
