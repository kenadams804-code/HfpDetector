name: Build Android APK (signed)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_VERSION: "8.7"
      ANDROID_PLATFORM: "34"
      ANDROID_BUILD_TOOLS: "34.0.0"

      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          yes | sdkmanager --licenses

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Download Gradle (no wrapper)
        run: |
          curl -L -o gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q gradle.zip
          mv "gradle-${GRADLE_VERSION}" /tmp/gradle
          /tmp/gradle/bin/gradle --version

      - name: Decode keystore
        run: |
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > keystore.jks
          echo "SIGNING_KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.jks" >> $GITHUB_ENV
      
      - name: Verify keystore readable
        run: |
          keytool -list -keystore keystore.jks -storetype JKS -storepass "$SIGNING_KEYSTORE_PASSWORD" | head -n 30

      - name: Build APK (debug + release)
        run: |
          /tmp/gradle/bin/gradle clean assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
