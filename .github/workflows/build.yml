name: Build Android APK (Cloud Only)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_VERSION: "8.7"
      ANDROID_PLATFORM: "34"
      ANDROID_BUILD_TOOLS: "34.0.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          yes | sdkmanager --licenses

      - name: Write local.properties (sdk.dir)
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties

      - name: Download Gradle (fixed version, no wrapper)
        run: |
          set -e
          curl -L -o gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q gradle.zip
          mv "gradle-${GRADLE_VERSION}" /tmp/gradle
          /tmp/gradle/bin/gradle --version

      - name: Build Debug APK (extract error lines)
        shell: bash
        run: |
          set +e

          echo "---- Kotlin files ----"
          find app/src -name "*.kt" -print || true
          echo "---- Search compose keywords ----"
          grep -RIn "androidx.compose\|Modifier\|padding(" app/src || true

          echo "---- Build start ----"
          /tmp/gradle/bin/gradle clean assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee gradle.log
          status=${PIPESTATUS[0]}

          echo ""
          echo "==================== Kotlin compiler error lines (e:) ===================="
          grep -n "^e: " gradle.log || true

          echo ""
          echo "==================== Other error keywords ===================="
          grep -n "Unresolved reference\|error:\|Compilation error\|Manifest merger failed\|FAILURE: Build failed" gradle.log || true

          echo ""
          echo "==================== Tail (last 160 lines) ===================="
          tail -n 160 gradle.log || true

          exit $status

      - name: Upload gradle log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log

      - name: Upload APK Artifact (only if build succeeded)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
