plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ksPath = System.getenv("SIGNING_KEYSTORE_PATH") ?: ""
def ksPass = System.getenv("SIGNING_KEYSTORE_PASSWORD") ?: ""
def ksAlias = System.getenv("SIGNING_KEY_ALIAS") ?: ""
def keyPass = System.getenv("SIGNING_KEY_PASSWORD") ?: ""

android {
    namespace 'com.example.hfpdetector'

    // ✅ Android 15 是 35。你现在是 34（Android 14）。
    // 如果你的构建环境还没装 35，也可以先继续用 34，不影响在 Android 15 上运行。
    compileSdk 35

    defaultConfig {
        applicationId "com.example.hfpdetector"

        // ✅ 推荐：兼容到 Android 6+
        minSdk 23

        // ✅ 面向 Android 15
        targetSdk 35

        // 每次发布都要 +1
        versionCode 4
        versionName "3.1"
    }

    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
