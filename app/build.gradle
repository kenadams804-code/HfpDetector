plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

def ksPath = System.getenv("SIGNING_KEYSTORE_PATH") ?: ""
def ksPass = System.getenv("SIGNING_KEYSTORE_PASSWORD") ?: ""
def ksAlias = System.getenv("SIGNING_KEY_ALIAS") ?: ""
def keyPass = System.getenv("SIGNING_KEY_PASSWORD") ?: ""

android {
    namespace 'com.example.hfpdetector'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.hfpdetector"
        minSdk 29
        targetSdk 34

        versionCode 4
        versionName "3.1"
    }

    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // ✅ Room（App 内通话记录/短信箱）
    implementation "androidx.room:room-runtime:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
}
