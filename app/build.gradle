plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ksPath = System.getenv("SIGNING_KEYSTORE_PATH") ?: ""
def ksPass = System.getenv("SIGNING_KEYSTORE_PASSWORD") ?: ""
def ksAlias = System.getenv("SIGNING_KEY_ALIAS") ?: ""
def keyPass = System.getenv("SIGNING_KEY_PASSWORD") ?: ""

android {
    namespace 'com.example.hfpdetector'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.hfpdetector"
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }

    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // 关键：debug 也用同一套签名，这样你装 debug 也能覆盖升级
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
