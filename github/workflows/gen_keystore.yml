name: Generate Keystore (one-time)

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias lancall \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -keystore lancall.jks \
            -storepass "ChangeMe_StorePass_123" \
            -keypass "ChangeMe_KeyPass_123" \
            -dname "CN=LanCall, OU=LanCall, O=LanCall, L=LanCall, S=LanCall, C=CN"

          # 导出 base64，方便放到 GitHub Secrets
          base64 -w 0 lancall.jks > lancall.jks.b64

      - name: Upload keystore + base64
        uses: actions/upload-artifact@v4
        with:
          name: lancall-keystore
          path: |
            lancall.jks
            lancall.jks.b64
